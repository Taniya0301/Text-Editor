<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="A small text editor where you can customise the background colour, text colour and font.">
    <title>Text Editor Customizer</title>
    <link rel="stylesheet" href="index.css">
    <script src="script.js" defer></script>
</head>
<body>
    <main class="page">
        <h1>Text Editor Customizer</h1>

        <form id="settings-form" class="settings" aria-label="Editor settings">
            <div class="field">
                <label for="bg">Background Colour:</label>
                <input type="color" id="bg" value="#ffffff">
            </div>

            <div class="field">
                <label for="txt">Text Colour:</label>
                <input type="color" id="txt" value="#000000">
            </div>

            <div class="field">
                <label for="font">Font Family:</label>
                <select id="font">
                    <option value="Arial, sans-serif" selected>Arial</option>
                    <option value="Georgia, serif">Georgia</option>
                    <option value="Verdana, sans-serif">Verdana</option>
                    <option value="'Courier New', monospace">Courier New</option>
                    <option value="'Times New Roman', serif">Times New Roman</option>
                </select>
            </div>
        </form>

        <h2 id="editor-heading">Your Editor Box</h2>

        <textarea id="box" aria-labelledby="editor-heading" placeholder="Start typing here...."></textarea>

        <button type="reset" form="settings-form" class="btn">Reset</button>
    </main>
</body>
</html>
