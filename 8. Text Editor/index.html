
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Text Editor</title>
    <link rel="stylesheet" href="index.css">
</head>
<body>

    <center>

        <h1>Text Editor Customizer</h1>
        <br>

        <div id="settings">

            <label>Background Colour:</label>
            <input type="color" id="bg" value="#ffffff"
            oninput="document.getElementById('box').style.backgroundColor=this.value">

            <br><br>

            <label>Text Colour:</label>
            <input type="color" id="txt" value="#000000"
            oninput="document.getElementById('box').style.color=this.value">

            <br><br>

            <label>Font Family:</label>
            <select id="font" onchange="document.getElementById('box').style.fontFamily=this.value">
                <option value="Arial">Arial</option>
                <option value="Georgia">Georgia</option>
                <option value="Verdana">Verdana</option>
                <option value="Courier New">Courier New</option>
                <option value="Times New Roman">Times New Roman</option>
            </select>

        </div>

        <br>

        <h2>Your Editor Box</h2>

        <textarea id="box" placeholder="Start typing here...."></textarea>

        <br><br>

        <button onclick="reset()">Reset</button>

    </center>

    <script>

        function reset()
        {
            document.getElementById('box').style.backgroundColor = "white";
            document.getElementById('box').style.color = "black";
            document.getElementById('box').style.fontFamily = "Arial";

            document.getElementById('bg').value = "#ffffff";
            document.getElementById('txt').value = "#000000";
            document.getElementById('font').value = "Arial";
        }

    </script>

</body>
</html>
